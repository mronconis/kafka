---
# skip prerun because I am experiencing the issue described here:
# https://github.com/ansible/ansible-lint/issues/2070
# fix podman dns resolution
# https://github.com/ansible-community/molecule-podman/discussions/120
prerun: false
dependency:
  name: galaxy
driver:
  name: podman
lint: |
  ansible-lint -v
platforms:

  - name: machine1
    hostname: machine1
    image: registry.access.redhat.com/ubi9/ubi-init:latest
    pre_build_image: true
    privileged: true
    command: "/usr/sbin/init"
    groups:
      - controller
      - broker
    network: molecule
    subnet: 10.0.1.0/16
    ip: 10.0.1.1

  - name: machine2
    hostname: machine2
    image: registry.access.redhat.com/ubi9/ubi-init:latest
    pre_build_image: true
    privileged: true
    command: "/usr/sbin/init"
    groups:
      - controller
      - broker
    network: molecule
    subnet: 10.0.1.0/16
    ip: 10.0.1.2

  - name: machine3
    hostname: machine3
    image: registry.access.redhat.com/ubi9/ubi-init:latest
    pre_build_image: true
    privileged: true
    command: "/usr/sbin/init"
    groups:
      - controller
      - broker
    network: molecule
    subnet: 10.0.1.0/16
    ip: 10.0.1.3

  - name: machine4
    hostname: machine4
    image: registry.access.redhat.com/ubi9/ubi-init:latest
    pre_build_image: true
    privileged: true
    command: "/usr/sbin/init"
    groups:
      - connect
    network: molecule
    subnet: 10.0.1.0/16
    ip: 10.0.1.4

  - name: machine5
    hostname: machine5
    image: registry.access.redhat.com/ubi9/ubi-init:latest
    pre_build_image: true
    privileged: true
    command: "/usr/sbin/init"
    groups:
      - connect
    network: molecule
    subnet: 10.0.1.0/16
    ip: 10.0.1.5

provisioner:
  name: ansible
  env:
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.collections"
  # ansible_args:
  #   - --diff
  #   - -vvv
  playbooks:
    converge: converge.yml
    prepare: ../shared/prepare.yml
    verify: verify.yml
  inventory:
    group_vars:
      all:
        amqstreams_version: "3.2.1"
        amqstreams_enable: true
        kafka_prereqs_setup_openjdk_package_name: java-21-openjdk

        kafka_advertised_host: "{{ ansible_hostname }}"
        #kafka_advertised_interface_name: eth0
        
        # kraft mode
        kafka_kraft_mode: true
        kafka_cluster_id: YPfyovBeRWmvbFDAzikROA
        kafka_skip_setup_storage: false

        kafka_tls_config:
          enabled: true
          trustedCA:
            type: PEM
            file: "${MOLECULE_SCENARIO_DIRECTORY}/../shared/certs/ca-root.pem"
            location: "{{ kafka_home }}/security/ansible_kafka-ca.crt"
          keystore:
            file: "${MOLECULE_SCENARIO_DIRECTORY}/../shared/certs/cert-cluster.p12"
            location: "{{ kafka_home }}/security/ansible_kafka-keystore.p12"
            password: changeit
            type: PKCS12
      
        kafka_authorization:
          type: simple
          deny_by_default: false
          super_users:
            - User:CN=kafka,O=Saiello,L=Rome,C=IT
            - User:admin

      controller:
        _controller_kafka_listeners:

          - name: CONTROLLER
            port: 9090
            tls: true 
            authentication:
              type: tls
        
        _controller_kafka_admin:
          listener_name: CONTROLLER
          authentication:
            type: tls
          tls:
            enabled: true
            trustedCA:
              type: PEM
              file: "${MOLECULE_SCENARIO_DIRECTORY}/../shared/certs/ca-root.pem"
              location: "{{ kafka_home }}/security/ansible_kafka-ca.crt"
            keystore:
              file: "${MOLECULE_SCENARIO_DIRECTORY}/../shared/certs/cert-cluster.p12"
              location: "{{ kafka_home }}/security/ansible_kafka-keystore.p12"
              password: changeit
              type: PKCS12

      broker:
        kafka_listeners:

          - name: CONTROLLER
            port: 9090
            tls: true 
            authentication:
              type: tls

          - name: REPLICATION
            port: 9091
            tls: true 
            authentication:
              type: tls
       
          - name: CLIENT
            port: 9092
            tls: false
          
          - name: ADMIN
            port: 9093
            tls: true 
            authentication:
              type: tls

        kafka_additional_conf:
          num.partitions: 1
          log.retention.hours: 148
          auto.create.topics.enable: 'false'
          min.insync.replicas: 2
          default.replication.factor: 3
          offsets.topic.replication.factor: 3
          status.storage.replication.factor: 3
          transaction.state.log.replication.factor: 3
          transaction.state.log.min.isr: 2

        kafka_inter_broker_listener_name: REPLICATION
        
        kafka_admin:
          listener_name: ADMIN
          authentication:
            type: tls
          tls:
            enabled: true
            trustedCA:
              type: PEM
              file: "${MOLECULE_SCENARIO_DIRECTORY}/../shared/certs/ca-root.pem"
              location: "{{ kafka_home }}/security/ansible_kafka-ca.crt"
            keystore:
              file: "${MOLECULE_SCENARIO_DIRECTORY}/../shared/certs/cert-cluster.p12"
              location: "{{ kafka_home }}/security/ansible_kafka-keystore.p12"
              password: changeit
              type: PKCS12
        
        kafka_server_properties_template: kraft/broker.properties.j2
        kafka_server_properties_file_name: broker.properties

      connect:
        kafka_connect_bootstrap_servers: machine1:9092,machine2:9092,machine3:9092

    host_vars:
      machine1:
        kafka_controller_id: 1
        kafka_broker_id: 4
        kafka_dir_id: 1IPhBz5sQEuxBCNR15oApA
      machine2:
        kafka_controller_id: 2
        kafka_broker_id: 5
        kafka_dir_id: ZuzSytQ3TxaD-nj3l3LY_A
      machine3:
        kafka_controller_id: 3
        kafka_broker_id: 6
        kafka_dir_id: AZN1GcFyT7GFUc9_vyVvLg
      localhost:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

verifier:
  name: ansible
