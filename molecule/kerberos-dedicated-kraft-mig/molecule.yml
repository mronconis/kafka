---
# skip prerun because I am experiencing the issue described here:
# https://github.com/ansible/ansible-lint/issues/2070
prerun: false
dependency:
  name: galaxy
driver:
  name: podman
lint: |
  ansible-lint -v
platforms:

  - name: kdc
    image: quay.io/centos-bootc/centos-bootc:stream9
    hostname: kdc.example.redhat.com
    network: molecule
    pre_build_image: true
    privileged: true
    command: "/usr/sbin/init"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

  - name: machine1
    image: registry.access.redhat.com/ubi9/ubi-init:latest
    hostname: machine1.example.redhat.com
    network: molecule
    pre_build_image: true
    privileged: true
    command: "/usr/sbin/init"
    groups:
      - zookeeper
      #- controller

  - name: machine2
    image: registry.access.redhat.com/ubi9/ubi-init:latest
    hostname: machine2.example.redhat.com
    network: molecule
    pre_build_image: true
    privileged: true
    command: "/usr/sbin/init"
    groups:
      - zookeeper
      #- controller

  - name: machine3
    image: registry.access.redhat.com/ubi9/ubi-init:latest
    hostname: machine3.example.redhat.com
    network: molecule
    pre_build_image: true
    privileged: true
    command: "/usr/sbin/init"
    groups:
      - zookeeper
      #- controller

  - name: machine4
    image: registry.access.redhat.com/ubi9/ubi-init:latest
    hostname: machine4.example.redhat.com
    network: molecule
    pre_build_image: true
    privileged: true
    command: "/usr/sbin/init"
    groups:
      - kafka
      #- broker

  - name: machine5
    image: registry.access.redhat.com/ubi9/ubi-init:latest
    hostname: machine5.example.redhat.com
    network: molecule
    pre_build_image: true
    privileged: true
    command: "/usr/sbin/init"
    groups:
      - kafka
      #- broker

  - name: machine6
    image: registry.access.redhat.com/ubi9/ubi-init:latest
    hostname: machine6.example.redhat.com
    network: molecule
    pre_build_image: true
    privileged: true
    command: "/usr/sbin/init"
    groups:
      - kafka
      #- broker

  - name: machine7
    image: registry.access.redhat.com/ubi9/ubi-init:latest
    hostname: machine7.example.redhat.com
    network: molecule
    pre_build_image: true
    privileged: true
    command: "/usr/sbin/init"
    groups:
      - kafka
      #- broker

scenario:
  test_sequence:
    - create
    - prepare
    - converge
    - verify
    - destroy
    
provisioner:
  name: ansible
  env:
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.collections"
    ANSIBLE_ROLES_PATH: "../../roles:~/.ansible/roles"
  ansible_args:
    - --diff
  playbooks:
    converge: converge.yml
    prepare: prepare.yml
    verify: verify.yml
  inventory:
    group_vars:
      all:
        amqstreams_version: "2.6.0"
        amqstreams_enable: true
        kafka_prereqs_setup_openjdk_package_name: java-17-openjdk
        
        #kafka_cluster_id: pc_ZVChNRl-UL8AKO7hGbg
        
        # moved from zk group to all
        zookeeper_interface_name: eth0
        zookeeper_auth_type: gssapi

      zookeeper:
        # moved to all
        # zookeeper_interface_name: eth0
        # zookeeper_auth_type: gssapi
        zookeeper_auth_quorum_enabled: true
        zookeeper_auth_client_enabled: true

        zookeeper_kerberos_keytab_skip_copy: false
        zookeeper_kerberos_keytab_file: /tmp/keytabs/zookeeper-{{ ansible_hostname }}.keytab
        zookeeper_kerberos_jaas_login_renew: 7200000

        zookeeper_conf_quorum_enable_sasl: true
        zookeeper_conf_quorum_learner_require_sasl: true
        zookeeper_conf_quorum_server_require_sasl: true

        zookeeper_jaas_debug: false

        zookeeper_java_opts:
          - -Dsun.security.krb5.debug=false
          - -Dzookeeper.admin.serverAddress=127.0.0.1
        
        zookeeper_metrics_provider_enabled: false

      controller:

        _controller_kafka_advertised_interface_name: eth0
        _controller_kafka_advertised_host: "{{ ansible_facts['fqdn'] }}"
        
        _controller_kafka_kerberos_keytab_skip_copy: false
        _controller_kafka_kerberos_keytab_file: /tmp/keytabs/kafka-{{ ansible_hostname }}.keytab

        _controller_kafka_listeners:

          - name: CONTROLLER
            port: 9092
            tls: false
            authentication:
              type: gssapi
              config:
                debug: "{{ kafka_jaas_debug }}"        
                useKeyTab: true
                storeKey: true
                keyTab: "{{ kafka_kerberos_keytab_location }}"
                principal: "{{ kafka_kerberos_principal }}"

          - name: REPLICATION
            port: 9091
            tls: false
            authentication:
              type: gssapi
              config:
                debug: "{{ kafka_jaas_debug }}"        
                useKeyTab: true
                storeKey: true
                keyTab: "{{ kafka_kerberos_keytab_location }}"
                principal: "{{ kafka_kerberos_principal }}"

        _controller_kafka_admin:
          listener_name: CONTROLLER

        _controller_kafka_inter_broker_listener_name: REPLICATION

        _controller_kafka_log_dirs:
          - /var/data/kafka-controller

        _controller_kafka_log4j_dir: /var/log/kafka-controller
      
        _controller_kafka_metrics_enabled: true
        _controller_kafka_metrics_port: 9405
        
        _controller_kafka_service_limit_mem_lock: 4294967296
        _controller_kafka_service_standard_output: null

      kafka:
        kafka_kraft_mode: false

        kafka_advertised_host: "{{ ansible_facts['fqdn'] }}"
        kafka_advertised_interface_name: eth0

        kafka_kerberos_keytab_skip_copy: false
        kafka_kerberos_keytab_file: /tmp/keytabs/kafka-{{ ansible_hostname }}.keytab

        kafka_authorization:
          type: simple
          deny_by_default: true
          super_users:
            - User:kafka
            - User:admin

        kafka_listeners:
          - name: CONTROLLER
            port: 9092
            tls: false
            authentication:
              type: gssapi
              config:
                debug: "{{ kafka_jaas_debug }}"        
                useKeyTab: true
                storeKey: true
                keyTab: "{{ kafka_kerberos_keytab_location }}"
                principal: "{{ kafka_kerberos_principal }}"

          - name: CONTROL
            port: 9090
            tls: false
            authentication:
              type: gssapi
              config:
                debug: "{{ kafka_jaas_debug }}"        
                useKeyTab: true
                storeKey: true
                keyTab: "{{ kafka_kerberos_keytab_location }}"
                principal: "{{ kafka_kerberos_principal }}"

          - name: REPLICATION
            port: 9091
            tls: false
            authentication:
              type: gssapi
              config:
                debug: "{{ kafka_jaas_debug }}"        
                useKeyTab: true
                storeKey: true
                keyTab: "{{ kafka_kerberos_keytab_location }}"
                principal: "{{ kafka_kerberos_principal }}"
          
          - name: SCRAM
            port: 9093
            tls: false
            authentication:
              type: scram-sha-512

        kafka_additional_conf:
          auto.create.topics.enable: 'false'
          control.plane.listener.name: CONTROL
          zookeeper.set.acl: 'true'
          metric.reporters: com.linkedin.kafka.cruisecontrol.metricsreporter.CruiseControlMetricsReporter
          cruise.control.metrics.topic.auto.create: 'true'
          cruise.control.metrics.topic.num.partitions: 1
          cruise.control.metrics.topic.replication.factor: 4
          cruise.control.metrics.reporter.security.protocol: SASL_PLAINTEXT
          cruise.control.metrics.reporter.sasl.mechanism: GSSAPI
          cruise.control.metrics.reporter.sasl.kerberos.service.name: kafka
          cruise.control.metrics.reporter.sasl.jaas.config: >-
            com.sun.security.auth.module.Krb5LoginModule required
            debug="false"
            useKeyTab="true"
            storeKey="true"
            doNotPrompt="false"
            keyTab="{{ kafka_kerberos_keytab_location }}"
            principal="{{ kafka_kerberos_principal }}";
          cruise.control.metrics.reporter.bootstrap.servers: "machine4.example.redhat.com:9090,machine5.example.redhat.com:9090,machine6.example.redhat.com:9090,machine7.example.redhat.com:9090"
          transaction.state.log.min.isr: 3
          transaction.state.log.replication.factor: 4
          offsets.topic.replication.factor: 4
          min.insync.replicas: 3
          group.initial.rebalance.delay.ms: 3000
          default.replication.factor: 4
          broker.rack: "{{ kafka_rack }}"
          inter.broker.protocol.version: "{{ kafka_inter_broker_protocol_version | default('3.6') }}"

        kafka_inter_broker_listener_name: REPLICATION
        
        kafka_admin:
          listener_name: CONTROL
          authentication:
            type: gssapi
            config:
              debug: false
              useKeyTab: true
              storeKey: true
              doNotPrompt: false
              keyTab: "{{ kafka_kerberos_keytab_location }}"
              principal: "{{ kafka_kerberos_principal }}"
        
        kafka_jaas_debug: false

        kafka_java_opts:
          - -Dsun.security.krb5.debug=false

        kafka_metrics_enabled: true
        kafka_metrics_port: 9404
        
        kafka_service_limit_mem_lock: 4294967296
        kafka_service_standard_output: null

    host_vars:
      machine1:
        zookeeper_myid: 1
        kafka_controller_id: 5
        kafka_dir_id: UPjB-xIARYOIvYhEt3NI3A
      machine2:
        zookeeper_myid: 2
        kafka_controller_id: 6
        kafka_dir_id: gqrLT8V_TdKOqCAfDtg7pA
      machine3:
        zookeeper_myid: 3
        kafka_controller_id: 7
        kafka_dir_id: vR674QBBT8C9kbODdU1naw
      machine4:
        kafka_broker_id: 1
        kafka_rack: dc-1
      machine5:
        kafka_broker_id: 2
        kafka_rack: dc-1
      machine6:
        kafka_broker_id: 3
        kafka_rack: dc-2
      machine7:
        kafka_broker_id: 4
        kafka_rack: dc-2
      localhost:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

verifier:
  name: ansible
