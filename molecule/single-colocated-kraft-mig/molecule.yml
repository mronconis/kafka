---
# skip prerun because I am experiencing the issue described here:
# https://github.com/ansible/ansible-lint/issues/2070
prerun: false
dependency:
  name: galaxy
driver:
  name: podman
lint: |
  ansible-lint -v
platforms:

  - name: machine1
    image: registry.access.redhat.com/ubi9/ubi-init:latest
    hostname: machine1
    network: molecule
    pre_build_image: true
    privileged: true
    command: "/usr/sbin/init"
    groups:
      - zookeeper
      - kafka
      #- controller
      #- broker

scenario:
  test_sequence:
    - create
    - prepare
    - converge
    - verify
    - destroy

provisioner:
  name: ansible
  env:
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.collections"
  ansible_args:
    - --diff
  playbooks:
    converge: converge.yml
    prepare: prepare.yml
    verify: verify.yml
  inventory:

    group_vars:
      all:
        amqstreams_version: "2.6.0"
        amqstreams_enable: true
        kafka_prereqs_setup_openjdk_package_name: java-17-openjdk
        
        #kafka_cluster_id: _losvMygQRypghTtcrkn2Q

      zookeeper:
        zookeeper_interface_name: lo
        
        zookeeper_client_address: 127.0.0.1

        zookeeper_java_opts:
          - -Dzookeeper.admin.serverAddress=127.0.0.1
      
      controller:

        _controller_kafka_advertised_interface_name: eth0
        _controller_kafka_advertised_host: "{{ ansible_hostname }}"
        
        _controller_kafka_admin:
          listener_name: CONTROLLER

        _controller_kafka_listeners:

          - name: CONTROLLER
            port: 9091
            tls: false

          - name: INTER
            port: 9092
            tls: false

        _controller_kafka_inter_broker_listener_name: INTER

        _controller_kafka_log_dirs:
          - /var/data/kafka-controller

        _controller_kafka_log4j_dir: /var/log/kafka-controller
      
      kafka:
        kafka_kraft_mode: false

        kafka_advertised_host: "{{ ansible_hostname }}"
        kafka_advertised_interface_name: eth0

        kafka_authorization:
          type: simple
          deny_by_default: false
          super_users:
            - User:admin

        kafka_admin:
          listener_name: INTER

        kafka_listeners:

          - name: CONTROLLER
            port: 9091
            tls: false

          - name: INTER
            port: 9092
            tls: false

          - name: SCRAM
            port: 9093
            tls: false
            authentication:
              type: scram-sha-512

        kafka_additional_conf:
          num.partitions: 1
          log.retention.hours: 148
          default.replication.factor: 1
          min.insync.replicas: 1
          transaction.state.log.min.isr: 1
          transaction.state.log.replication.factor: 1
          offsets.topic.replication.factor: 1
          inter.broker.protocol.version: "{{ kafka_inter_broker_protocol_version | default('3.6') }}"

        kafka_inter_broker_listener_name: INTER

    host_vars:
      machine1:
        kafka_broker_id: 1
        zookeeper_myid: 1
        kafka_controller_id: 2
        kafka_dir_id: ZuzSytQ3TxaD-nj3l3LY_A
      localhost:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

verifier:
  name: ansible