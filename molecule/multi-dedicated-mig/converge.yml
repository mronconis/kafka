---
- name: Run cluster upgrade up to 2.7.0
  import_playbook: ../../playbooks/upgrade.yml
  vars:
    kafka_inter_broker_protocol_version: 3.6
    amqstreams_version: 2.7.0

- name: Run Update cluster
  import_playbook: ../../playbooks/update.yml
  vars:
    kafka_inter_broker_protocol_version: 3.7
    kafka_home: /opt/kafka/kafka_2.13-3.7.0.redhat-00007

- name: Run cluster upgrade up to 2.8.0
  import_playbook: ../../playbooks/upgrade.yml
  vars:
    kafka_inter_broker_protocol_version: 3.7
    amqstreams_version: 2.8.0

- name: Run Update cluster
  import_playbook: ../../playbooks/update.yml
  vars:
    kafka_inter_broker_protocol_version: 3.8
    kafka_home: /opt/kafka/kafka_2.13-3.8.0.redhat-00007

- name: Run cluster upgrade up to 2.9.4
  import_playbook: ../../playbooks/upgrade.yml
  vars:
    kafka_inter_broker_protocol_version: 3.8
    amqstreams_version: 2.9.4

- name: Run Update cluster
  import_playbook: ../../playbooks/update.yml
  vars:
    kafka_inter_broker_protocol_version: 3.9
    kafka_home: /opt/kafka/kafka_2.13-3.9.2.redhat-00007

- name: Dynamically adds hosts to kraft ansible groups
  hosts: zookeeper,kafka
  gather_facts: false
  tasks:
    - name: Add zookeeper hosts to controller group
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups:
          - controller
      loop: "{{ groups['zookeeper'] | default([]) }}"
      run_once: true
    
    - name: Add kafka hosts to broker group
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups:
          - broker
      loop: "{{ groups['kafka'] | default([]) }}"
      run_once: true

- import_playbook: ../../playbooks/migrate.yml
  vars:
    kafka_inter_broker_protocol_version: 3.9
    kafka_log4j_debug_migration: true
    kafka_home: /opt/kafka/kafka_2.13-3.9.2.redhat-00007

