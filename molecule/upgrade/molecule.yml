---
# skip prerun because I am experiencing the issue described here:
# https://github.com/ansible/ansible-lint/issues/2070
prerun: false
dependency:
  name: galaxy
driver:
  name: podman
lint: |
  ansible-lint -v
platforms:

  - name: machine1
    image: registry.access.redhat.com/ubi8/ubi-init:latest
    hostname: machine1
    network: molecule
    pre_build_image: true
    privileged: true
    command: "/usr/sbin/init"
    groups:
      - kafka
      - zookeeper

  - name: machine2
    image: registry.access.redhat.com/ubi8/ubi-init:latest
    hostname: machine2
    network: molecule
    pre_build_image: true
    privileged: true
    command: "/usr/sbin/init"
    groups:
      - kafka
      - zookeeper

  - name: machine3
    image: registry.access.redhat.com/ubi8/ubi-init:latest
    hostname: machine3
    network: molecule
    pre_build_image: true
    privileged: true
    command: "/usr/sbin/init"
    groups:
      - kafka
      - zookeeper

provisioner:
  name: ansible
  env:
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.collections"
  ansible_args:
    - --diff
  playbooks:
    converge: converge.yml
    prepare: prepare.yml
    verify: verify.yml
  inventory:
    group_vars:
      all:
        amqstreams_version: "2.6.0"
        amqstreams_enable: true
        kafka_prereqs_setup_openjdk_package_name: java-17-openjdk
        kafka_kraft_mode: false

        kafka_advertised_interface_name: eth0
        zookeeper_interface_name: eth0
        
      kafka:
        kafka_advertised_host: "{{ ansible_hostname }}"

        kafka_authorization:
          type: simple
          deny_by_default: true
          super_users:
            - User:CN=kafka,O=Saiello,L=Rome,C=IT
            - User:CN=admin,O=Saiello,L=Rome,C=IT

        kafka_tls_config:
          enabled: true
          trustedCA:
            type: PEM
            file: "${MOLECULE_SCENARIO_DIRECTORY}/../shared/certs/ca-root.pem"
            location: "{{ kafka_home }}/security/ansible_kafka-ca.crt"
          keystore:
            file: "${MOLECULE_SCENARIO_DIRECTORY}/../shared/certs/cert-cluster.p12"
            location: "{{ kafka_home }}/security/ansible_kafka-keystore.p12"
            password: changeit
            type: PKCS12

        kafka_listeners:

          - name: replication
            port: 9091
            tls: true 
            authentication:
              type: tls
       
          - name: admin
            port: 9092
            tls: true
            authentication:
              type: tls

          - name: authenticated
            port: 9094
            tls: true 
            authentication:
              type: scram-sha-512

        kafka_additional_conf:
          num.partitions: 1
          log.retention.hours: 148
          inter.broker.protocol.version: 3.6

        kafka_inter_broker_listener_name: replication
        
        kafka_admin:
          listener_name: admin
          tls:
            enabled: true
            trustedCA:
              file: "${MOLECULE_SCENARIO_DIRECTORY}/../shared/certs/ca-root.pem"
              location: "{{ kafka_home }}/security/ansible_kafka-ca.crt"
              type: PEM
            keystore:
              file: "${MOLECULE_SCENARIO_DIRECTORY}/../shared/certs/cert-admin.p12"
              location: "{{ kafka_home }}/security/ansible_admin-keystore.p12"
              password: changeit
              type: PKCS12
        
    host_vars:
      machine1:
        kafka_broker_id: 1
        zookeeper_myid: 1
      machine2:
        kafka_broker_id: 2
        zookeeper_myid: 2
      machine3:
        kafka_broker_id: 3
        zookeeper_myid: 3
      localhost:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

scenario:
  test_sequence:
    - dependency
    # - lint
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    # - idempotence  <-- Omitted to skip idempotency check
    # - side_effect
    - verify
    - cleanup
    - destroy

verifier:
  name: ansible