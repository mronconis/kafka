---
# skip prerun because I am experiencing the issue described here:
# https://github.com/ansible/ansible-lint/issues/2070
prerun: false
dependency:
  name: galaxy
driver:
  name: podman
lint: |
  ansible-lint -v
platforms:

  - name: machine1
    image: registry.access.redhat.com/ubi8/ubi-init:latest
    hostname: machine1
    network: molecule
    pre_build_image: true
    privileged: true
    command: "/usr/sbin/init"
    groups:
      - zookeeper
      #- controller

  - name: machine2
    image: registry.access.redhat.com/ubi8/ubi-init:latest
    hostname: machine2
    network: molecule
    pre_build_image: true
    privileged: true
    command: "/usr/sbin/init"
    groups:
      - zookeeper
      #- controller

  - name: machine3
    image: registry.access.redhat.com/ubi8/ubi-init:latest
    hostname: machine3
    network: molecule
    pre_build_image: true
    privileged: true
    command: "/usr/sbin/init"
    groups:
      - zookeeper
      #- controller
  
  - name: machine4
    image: registry.access.redhat.com/ubi8/ubi-init:latest
    hostname: machine4
    network: molecule
    pre_build_image: true
    privileged: true
    command: "/usr/sbin/init"
    groups:
      - kafka
      #- broker

  - name: machine5
    image: registry.access.redhat.com/ubi8/ubi-init:latest
    hostname: machine5
    network: molecule
    pre_build_image: true
    privileged: true
    command: "/usr/sbin/init"
    groups:
      - kafka
      #- broker

  - name: machine6
    image: registry.access.redhat.com/ubi8/ubi-init:latest
    hostname: machine6
    network: molecule
    pre_build_image: true
    privileged: true
    command: "/usr/sbin/init"
    groups:
      - kafka
      #- broker

scenario:
  test_sequence:
    - create
    - prepare
    - converge
    - verify
    - destroy
    
provisioner:
  name: ansible
  env:
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.collections"
  ansible_args:
    - --diff
  playbooks:
    converge: converge.yml
    prepare: prepare.yml
    verify: verify.yml
  inventory:
    group_vars:
      all:
        amqstreams_version: "2.9.4" # last version with zookeeper support
        amqstreams_enable: true
        kafka_prereqs_setup_openjdk_package_name: java-21-openjdk
        
        #kafka_cluster_id: X0XyFRF2ROixsydDA4kw9g

        kafka_controller_listener_name: CONTROLLER
        kafka_inter_broker_listener_name: REPLICATION

        kafka_advertised_interface_name: eth0
        zookeeper_interface_name: eth0

        kafka_tls_config:
          enabled: true
          trustedCA:
            type: PEM
            file: "${MOLECULE_SCENARIO_DIRECTORY}/../shared/certs/ca-root.pem"
            location: "{{ kafka_home }}/security/ansible_kafka-ca.crt"
          keystore:
            file: "${MOLECULE_SCENARIO_DIRECTORY}/../shared/certs/cert-cluster.p12"
            location: "{{ kafka_home }}/security/ansible_kafka-keystore.p12"
            password: changeit
            type: PKCS12

      controller:
        _controller_kafka_advertised_host: "{{ ansible_hostname }}"
        
        _controller_kafka_listeners:

          - name: CONTROLLER
            port: 9090
            tls: true 
            authentication:
              type: tls

          - name: REPLICATION
            port: 9091
            tls: true 
            authentication:
              type: tls
       
        _controller_kafka_admin:
          listener_name: CONTROLLER
          
        _controller_kafka_log_dirs:
          - /var/data/kafka-controller

        _controller_kafka_log4j_dir: /var/log/kafka-controller
      
        _controller_kafka_java_opts:
          - -Djavax.net.debug=all

      broker:
        kafka_kraft_mode: false

        kafka_advertised_host: "{{ ansible_hostname }}"

        kafka_authorization:
          type: simple
          deny_by_default: true
          super_users:
            - User:CN=kafka,O=Saiello,L=Rome,C=IT
            - User:CN=admin,O=Saiello,L=Rome,C=IT

        kafka_listeners:
          # add beafore phase "pb: Migrate ZK to KRaft - Enable migration"
          - name: CONTROLLER
            port: 9090
            tls: true 
            authentication:
              type: tls

          - name: REPLICATION
            port: 9091
            tls: true 
            authentication:
              type: tls
       
          - name: ADMIN
            port: 9092
            tls: true
            authentication:
              type: tls

          - name: CLIENT
            port: 9094
            tls: true 
            authentication:
              type: scram-sha-512

        kafka_additional_conf:
          num.partitions: 1
          log.retention.hours: 148
          inter.broker.protocol.version: 3.9

        kafka_inter_broker_listener_name: REPLICATION
        
        kafka_admin:
          listener_name: ADMIN
          tls:
            enabled: true
            trustedCA:
              file: "${MOLECULE_SCENARIO_DIRECTORY}/../shared/certs/ca-root.pem"
              location: "{{ kafka_home }}/security/ansible_kafka-ca.crt"
              type: PEM
            keystore:
              file: "${MOLECULE_SCENARIO_DIRECTORY}/../shared/certs/cert-admin.p12"
              location: "{{ kafka_home }}/security/ansible_admin-keystore.p12"
              password: changeit
              type: PKCS12
        
    host_vars:
      machine1:
        zookeeper_myid: 1
        kafka_controller_id: 4
        kafka_dir_id: 1IPhBz5sQEuxBCNR15oApA
      machine2:
        zookeeper_myid: 2
        kafka_controller_id: 5
        kafka_dir_id: ZuzSytQ3TxaD-nj3l3LY_A
      machine3:
        zookeeper_myid: 3
        kafka_controller_id: 6
        kafka_dir_id: AZN1GcFyT7GFUc9_vyVvLg
      machine4:
        kafka_broker_id: 1
        kafka_node_id: 1
      machine5:
        kafka_broker_id: 2
        kafka_node_id: 2
      machine6:
        kafka_broker_id: 3
        kafka_node_id: 3
      localhost:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
verifier:
  name: ansible
