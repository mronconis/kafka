---
- name: Get all deployed connectors
  ansible.builtin.uri:
    url: "http://{{ kafka_connect_host | default('localhost') }}:8083/connectors"
    method: GET
    return_content: yes
  register: running_connectors

- name: Debug list of deployed connectors
  ansible.builtin.debug:
    var: running_connectors.json

- name: Upsert Kafka Connectors 
  ansible.builtin.uri:
    url: "http://{{ kafka_connect_host | default('localhost') }}:8083/connectors/{{ item.name }}/config"
    method: PUT
    body_format: json
    body: "{{ item.config }}"
    status_code: [200, 201]
    headers:
      Accept: "application/json"
      Content-Type: "application/json"
  loop: "{{ kafka_connect_connectors }}"
  when: item.state | default('present') == 'present'
  register: upsert_responses

- name: Debug upsert connectors
  ansible.builtin.debug: 
    var: item.json
  loop: "{{ upsert_responses.results }}"
  when: 
    - upsert_responses.results is defined
    - item.skipped is not defined or not item.skipped

- name: Delete Kafka Connectors 
  ansible.builtin.uri:
    url: "http://{{ kafka_connect_host | default('localhost') }}:8083/connectors/{{ item.name }}"
    method: DELETE
    status_code: [204, 404]
  loop: "{{ kafka_connect_connectors }}"
  when: 
    - item.state | default('present') == 'absent'
    - item.name in running_connectors.json

- name: Ensure all connectors are in running state
  ansible.builtin.uri:
    url: "http://{{ kafka_connect_host | default('localhost') }}:8083/connectors/{{ item.name }}/status"
    method: GET
    return_content: yes
    status_code: 200
  loop: "{{ kafka_connect_connectors }}"
  when: item.state | default('present') != 'absent'
  failed_when: >
    (json.tasks | default([])) | rejectattr('state', 'equalto', 'RUNNING') | list | length > 0
